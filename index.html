<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Especial ❤️</title>
    <style>
        body {
            background-color: #ffe6e8;
            font-family: 'Arial', sans-serif;
            text-align: center;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            padding: 20px;
            max-width: 400px;
        }
        h1 {
            color: #d63384;
            font-size: 26px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .botoes {
            position: relative;
            width: 100%;
            height: 120px;
        }
        button {
            font-size: 18px;
            font-weight: bold;
            padding: 12px 28px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s;
        }
        #btnSim {
            background-color: #28a745;
            position: absolute;
            left: calc(50% - 110px);
        }
        #btnNao {
            background-color: #dc3545;
            position: absolute;
            left: calc(50% + 10px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Bom dia, meu bem! ☀️❤️</h1>
        <p>Para o meu dia começar perfeito, só preciso de uma resposta:</p>
        <p style="font-size: 20px; font-weight: bold; color: #d63384;">Você Aceita Sair Comigo?</p>
        
        <div class="botoes">
            <button id="btnSim" onclick="aceitou()">SIM!</button>
            <button id="btnNao" onmouseover="fugir()" ontouchstart="fugir()">Não</button>
        </div>
    </div>

    <script>
        function aceitou() {
            alert("Sabia que você ia aceitar! 🥰 Te amo, o meu dia já começou maravilhoso!");
            location.reload();
        }

        function fugir() {
            const btnNao = document.getElementById('btnNao');
            const larguraJanela = window.innerWidth - 120;
            const alturaJanela = window.innerHeight - 120;
            
            const randomX = Math.random() * larguraJanela;
            const randomY = Math.random() * alturaJanela;
            
            btnNao.style.position = 'fixed';
            btnNao.style.left = randomX + 'px';
            btnNao.style.top = randomY + 'px';
        }
    </script>
</body>
</html>
